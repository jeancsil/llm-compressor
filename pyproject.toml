[project]
name = "llm-compressor"
version = "0.1.0"
description = "FastAPI proxy that compresses prompts before forwarding to the Anthropic API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "fastapi>=0.136.1",
    "headroom-ai[ml]>=0.1.0",
    "httpx>=0.28.1",
    "huggingface_hub>=0.23.0",
    "llmlingua>=0.2.2",
    "safetensors>=0.4.0",
    "torch>=2.11.0",
    "transformers>=4.40.0",
    "uvicorn>=0.46.0",
]

[project.scripts]
llm-compressor = "llm_compressor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_compressor = ["templates/*.html", "templates/*.js"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]
langfuse = [
    "langfuse>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Agent worktrees are full copies of this repo; linting them double-reports
# every finding against a checkout nobody edits.
exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
