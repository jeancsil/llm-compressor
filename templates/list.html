<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sessions · LLMLingua</title>
<!--TOKENS-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'SF Mono', 'Fira Code', monospace; padding: 20px 48px; max-width: 1440px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .title { color: var(--accent-active); font-size: 14px; font-weight: 700; letter-spacing: .04em; }
  .header-right { display: flex; align-items: center; gap: 16px; font-size: 11px; color: var(--text-muted); }
  a { color: var(--accent-active); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .summary { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 16px; font-size: 12px; color: var(--text-muted); display: flex; gap: 28px; flex-wrap: wrap; }
  .summary b { color: var(--text); }
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; }
  .section-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 13px; display: flex; align-items: center; gap: 10px; }
  .section-title::before { content: ''; width: 3px; height: 13px; border-radius: 2px; flex-shrink: 0; background: var(--text-muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--text-muted); padding: 6px 10px; border-bottom: 1px solid var(--border); font-weight: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-raised); }
  .cell-saved { color: var(--accent-savings); font-weight: 600; }
  .cell-muted { color: var(--text-muted); }
  .cell-dim { color: var(--text-muted); opacity: .7; }
  .empty { text-align: center; color: var(--text-muted); padding: 40px; font-size: 12px; }
  .pager { display: flex; align-items: center; gap: 10px; padding: 12px 0 4px; margin-top: 2px; border-top: 1px solid var(--border); }
  .pager-btn { background: var(--surface-raised); color: var(--accent-active); border: 1px solid var(--border); border-radius: 5px; padding: 3px 10px; cursor: pointer; font-family: inherit; font-size: 11px; line-height: 1.4; }
  .pager-btn:hover:not(:disabled) { border-color: var(--accent-active); }
  .pager-btn:disabled { opacity: .35; cursor: default; }
  .pager-info { color: var(--text-muted); font-size: 11px; line-height: 1.4; }
  .footer { font-size: 9px; color: var(--text-muted); text-align: center; padding-top: 8px; }
  @media (max-width: 900px) { body { padding: 16px 20px; } }
</style>
<!--THEME_SCRIPT-->
</head>
<body>
<div class="header">
  <div class="title">Sessions</div>
  <div class="header-right">
    <a href="/dashboard" style="color:var(--text-muted);font-size:11px;text-decoration:none;letter-spacing:.02em">← dashboard</a>
    <a href="/play" style="color:var(--text-muted);font-size:11px;text-decoration:none;letter-spacing:.02em">▶ play</a>
    <button class="theme-toggle" onclick="toggleTheme()">◐ theme</button>
  </div>
</div>
<div class="summary" id="summary">loading…</div>
<div class="section">
  <div class="section-title">Sessions</div>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Tokens Saved</th>
        <th>Requests</th>
        <th>Created</th>
        <th>Last Seen</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="pager"></div>
</div>
<div class="footer">All data from history.db &nbsp;·&nbsp; <a href="/dashboard">← back to dashboard</a></div>
<script>
function buildPager(containerId, page, pages, total, onPage) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (pages <= 0) { el.innerHTML = ''; return; }
  el.innerHTML =
    '<button class="pager-btn" id="' + containerId + '_prev" ' + (page <= 1 ? 'disabled' : '') + '>← Prev</button>' +
    '<span class="pager-info">Page ' + page + ' of ' + pages + ' &nbsp;·&nbsp; ' + total + ' total</span>' +
    '<button class="pager-btn" id="' + containerId + '_next" ' + (page >= pages ? 'disabled' : '') + '>Next →</button>';
  const prevBtn = document.getElementById(containerId + '_prev');
  const nextBtn = document.getElementById(containerId + '_next');
  if (prevBtn) prevBtn.onclick = () => onPage(page - 1);
  if (nextBtn) nextBtn.onclick = () => onPage(page + 1);
}
function fmt(n) {
  if (!n) return '—';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return n.toLocaleString();
}
function fmtDate(s) {
  if (!s) return '—';
  return s.replace('T', ' ').slice(0, 16);
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
let _sessionPage = 1;
const SESSION_PAGE_SIZE = 25;
async function load(page) {
  page = page || _sessionPage;
  _sessionPage = page;
  const data = await fetch('/admin/sessions?page=' + page + '&page_size=' + SESSION_PAGE_SIZE).then(r => r.json());
  const items = data.items || [];
  const totalSaved = items.reduce((a, s) => a + (s.tokens_saved || 0), 0);
  document.getElementById('summary').innerHTML =
    '<span><b>' + data.total + '</b> sessions total</span>' +
    '<span><b>' + items.length + '</b> sessions (this page)</span>' +
    '<span><b>' + fmt(totalSaved) + '</b> tokens saved (this page)</span>';
  const tbody = document.getElementById('rows');
  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No sessions yet.</td></tr>';
    document.getElementById('pager').innerHTML = '';
    return;
  }
  tbody.innerHTML = items.map(s => {
    const sessionId = encodeURIComponent(s.session_id);
    const displayName = s.display_name || ('session-' + s.session_id.slice(0, 8));
    return '<tr>'
      + '<td><a href="/dashboard/' + sessionId + '">' + escapeHtml(displayName) + '</a></td>'
      + '<td class="mono cell-saved">' + fmt(s.tokens_saved) + '</td>'
      + '<td class="mono cell-muted">' + (s.requests || '—') + '</td>'
      + '<td class="mono cell-dim">' + fmtDate(s.first_seen) + '</td>'
      + '<td class="mono cell-dim">' + fmtDate(s.last_seen) + '</td>'
      + '</tr>';
  }).join('');
  buildPager('pager', data.page, data.pages, data.total, load);
}
load();
</script>
</body>
</html>
